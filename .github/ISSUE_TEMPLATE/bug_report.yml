name: Bug report
description: A number is wrong, a file is read wrongly, or something fails.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Do not attach real loan data.** Describe the case, or reproduce it with `eqlx-portfolio sample` or a few made-up rows."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran (command or code, settings), what you expected and why, what you got.
    validations:
      required: true
  - type: textarea
    id: data
    attributes:
      label: Minimal input
      description: A few made-up loan rows and the settings that show the problem.
      render: text
  - type: input
    id: version
    attributes:
      label: Versions
      description: eqlx-portfolio, Python, NumPy and SciPy versions.
